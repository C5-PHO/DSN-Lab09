<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galería privada S3 · Lab 09</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script defer src="/static/app.js"></script>
  </head>
  <body>
    <main>
      <header><p class="eyebrow">Desarrollo de Soluciones en la Nube · Laboratorio 09</p><h1>Galería privada de imágenes</h1><p>Sube imágenes directamente a S3 mediante una URL temporal. El bucket permanece privado y el navegador no recibe credenciales de AWS.</p></header>
      <section class="panel" aria-labelledby="upload-title">
        <h2 id="upload-title">Subir imagen</h2>
        <form id="upload-form"><input id="file" type="file" accept="image/jpeg,image/png,image/webp" required><button type="submit">Subir imagen</button></form>
        <p class="hint">JPG, PNG o WebP · Menos de 5 MB</p><p id="status" role="status" aria-live="polite"></p>
      </section>
      <section aria-labelledby="gallery-title"><div class="section-head"><h2 id="gallery-title">Imágenes</h2><button id="refresh" class="secondary" type="button">Actualizar</button></div><div id="gallery" class="gallery"></div></section>
    </main>
  </body>
</html>
